{% extends 'administrasi/base.html' %}

{% block title %}Tambah Kamar - Kos Rafasya{% endblock %}
{% block header %}Tambah Kamar{% endblock %}

{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px; width: 50%;">
    <form method="POST" action="">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Nomor Kamar</label>
            <input type="text" name="nomor_kamar" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Tipe Kamar</label>
            <select name="tipe" required style="width: 100%; padding: 8px;">
                <option value="individu">Individu</option>
                <option value="berdua">Berdua</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Harga Sewa (Rp)</label>
            <input type="number" name="harga_sewa" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Fasilitas</label>
            <textarea name="fasilitas" rows="3" required style="width: 100%; padding: 8px;"></textarea>
        </div>

        <button type="submit"
            style="padding: 10px 15px; background: #333; color: white; border: none; cursor: pointer;">Simpan</button>
        <a href="{% url 'data_kamar' %}"
            style="padding: 10px 15px; background: #ccc; color: black; text-decoration: none; margin-left: 10px;">Batal</a>
    </form>
</div>
{% endblock %}
