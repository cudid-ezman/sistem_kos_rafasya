<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kos Rafasya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        .login-box input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Masuk ke Sistem</h2>
        <!-- Nanti form ini akan kita proses menggunakan metode POST -->
        <form method="POST" action="">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username atau Email" required>
            <input type="password" name="password" placeholder="********" required>
            <button type="submit">Masuk</button>
        </form>
        {% if messages %}
        <ul style="color: red; list-style-type: none; padding: 0;">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>

</body>

</html>
