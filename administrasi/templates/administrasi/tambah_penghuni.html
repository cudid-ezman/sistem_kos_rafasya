{% extends 'administrasi/base.html' %}

{% block title %}Tambah Penghuni - Kos Rafasya{% endblock %}
{% block header %}Tambah Penghuni{% endblock %}

{% block content %}
<div style="background: white; padding: 20px; border-radius: 8px; width: 50%;">
    <form method="POST" action="">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Nama Lengkap</label>
            <input type="text" name="nama" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Nomor Identitas (NIK)</label>
            <input type="text" name="no_identitas" required style="width: 100%; padding: 8px;">
            <small style="color: gray;">NIK akan digunakan sebagai Username login penghuni.</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Nomor Kontak</label>
            <input type="text" name="no_kontak" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Pilih Kamar</label>
            <select name="kamar_id" required style="width: 100%; padding: 8px;">
                {% for k in kamar_tersedia %}
                <option value="{{ k.id }}">{{ k.nomor_kamar }} (Rp {{ k.harga_sewa|floatformat:0 }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Tanggal Masuk</label>
            <input type="date" name="tanggal_masuk" required style="width: 100%; padding: 8px;">
        </div>

        <button type="submit"
            style="padding: 10px 15px; background: #333; color: white; border: none; cursor: pointer;">Simpan</button>
        <a href="{% url 'data_penghuni' %}"
            style="padding: 10px 15px; background: #ccc; color: black; text-decoration: none; margin-left: 10px;">Batal</a>
    </form>
</div>
{% endblock %}
